spring.application.name=seguridad

# Conexion a MySQL (base de datos creada en la Parte 1)
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# Clave HMAC para firmar los JWT de la API (Parte 2). El valor por defecto es
# solo para el laboratorio: en un ambiente real se define la variable JWT_SECRET
# y nunca se deja la clave real escrita en el repositorio.
app.jwt.secret=${JWT_SECRET:clave-secreta-minimo-32-caracteres-laboratorio}
app.jwt.expiracion-ms=3600000
