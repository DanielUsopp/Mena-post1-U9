<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis tareas</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <h1>Mis tareas</h1>
  <table>
    <thead><tr><th>Id</th><th>Título</th><th>Descripción</th><th>Completada</th></tr></thead>
    <tbody>
      <tr th:each="t : ${tareas}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.titulo}"></td>
        <td th:text="${t.descripcion}"></td>
        <td th:text="${t.completada} ? 'Sí' : 'No'"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(tareas)}"><td colspan="4">Todavía no tiene tareas.</td></tr>
    </tbody>
  </table>

  <div class="caja">
    <h3>Nueva tarea</h3>
    <form th:action="@{/tareas}" th:object="${tarea}" method="post">
      <label>Título: <input type="text" th:field="*{titulo}" /></label>
      <div class="error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
      <label>Descripción: <input type="text" th:field="*{descripcion}" /></label>
      <button type="submit">Guardar</button>
    </form>
  </div>
  <p><a th:href="@{/tareas/buscar}">Buscar tareas</a> · <a th:href="@{/dashboard}">Volver al dashboard</a></p>
</body>
</html>
