<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <h1>Panel de Administración</h1>
  <p>Usuarios registrados (solo visible para ROLE_ADMIN):</p>
  <table>
    <thead><tr><th>Id</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th></tr></thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.rol}"></td>
        <td th:text="${u.activo} ? 'Sí' : 'No'"></td>
      </tr>
    </tbody>
  </table>
  <p><a th:href="@{/dashboard}">Volver al dashboard</a></p>
</body>
</html>
