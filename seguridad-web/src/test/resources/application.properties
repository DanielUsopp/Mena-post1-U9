# Las pruebas usan H2 en memoria para no depender de un MySQL encendido
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Clave JWT de prueba (este archivo reemplaza al application.properties principal)
app.jwt.secret=clave-de-pruebas-minimo-32-caracteres-para-hmac
